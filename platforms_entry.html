        .glow-b {

            bottom: -90px; left: -90px;
            background: radial-gradient(circle, rgba(236,72,153,.42) 0%, rgba(236,72,153,0) 70%);
            animation: float 11s ease-in-out infinite reverse;
        }
        @keyframes float {
            0%, 100% { transform: translate(0, 0); }
            50% { transform: translate(-14px, 14px); }
        }
        /* subtle dot texture that fades downward */
        .dots {
            position: absolute; inset: 0;
            background-image: radial-gradient(rgba(255,255,255,.16) 1px, transparent 1px);
            background-size: 18px 18px;
            -webkit-mask-image: linear-gradient(180deg, rgba(0,0,0,.85), transparent 65%);
            mask-image: linear-gradient(180deg, rgba(0,0,0,.85), transparent 65%);
            pointer-events: none;
        }

            align-items: center;
            gap: 15px;

            -webkit-backdrop-filter: blur(6px);

        .field textarea { min-height: 86px; resize: none; }
        .field select { appearance: none; cursor: pointer; }
        .field input::placeholder, .field textarea::placeholder { color: transparent; }

        .field label {

            left: 14px;
            top: 15px;
            font-size: .86rem;
            color: var(--muted);
            pointer-events: none;
            transition: all .2s ease;

        .alert.ok  { background: #ecfdf5; border: 1px solid #a7f3d0; color: #047857; }
        .alert.err { background: #fff1f2; border: 1px solid #fecdd3; color: #be123c; }
        @keyframes pop { from { opacity: 0; transform: translateY(-6px); } to { opacity: 1; transform: none; } }

        @media (max-width: 760px) {
            .shell { grid-template-columns: 1fr; max-width: 460px; }
            .panel { padding: 30px 26px; gap: 0; }
            .features, .panel-foot { display: none; }

            .form-side { padding: 28px 24px 32px; }
        }
        @media (max-width: 420px) {

        }

</head>

        const link = document.getElementById('urlInput');
        link.href = '#';
        link.querySelector('.txt').textContent = '';
        link.classList.remove('filled');
        link.classList.add('disabled');
    }

    function onPlatformChange(selectElement) {
        const selected = selectElement.value;
        selectElement.classList.toggle('filled', !!selected);

        /* 1) Platform logo inside the Select Platform field */
        const logo = document.getElementById('platformLogo');
        if (selected && logoMap[selected]) {
            logo.src = logoMap[selected];
            logo.classList.add('show');
        } else {
            logo.classList.remove('show');
            logo.removeAttribute('src');
        }

        /* 2) Visit Platform becomes a clickable link to the platform URL */
        const url = platformMap[selected] || '';
        const link = document.getElementById('urlInput');
        if (url) {
            link.href = url;
            link.querySelector('.txt').textContent = url;
            link.classList.remove('disabled');
            link.classList.add('filled');
        } else {
            link.href = '#';
            link.querySelector('.txt').textContent = '';
            link.classList.remove('filled');
            link.classList.add('disabled');
        }
    }

    function handleFormSubmit(e) {
        e.preventDefault();
        const btn = document.getElementById('submitBtn');
        btn.disabled = true;
        btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i><span>Saving...</span>';

        const formData = {
            platforms: document.getElementById('platformSelect').value,
            url: document.getElementById('urlInput').href,
            username: document.getElementById('usernameInput').value,
            motherAccount: document.getElementById('motherAccountInput').value,
            notes: document.getElementById('notesInput').value
        };

        google.script.run
            .withSuccessHandler(function() {
                document.getElementById('alertBox').innerHTML = '<div class="alert ok"><i class="fas fa-check-circle"></i> Entry Saved Successfully!</div>';
                document.getElementById('entryForm').reset();
                document.getElementById('platformSelect').classList.remove('filled');
                resetPlatformUI(); /* hide platform logo + disable Visit link */
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i><span>Save Entry</span>';
                setTimeout(() => document.getElementById('alertBox').innerHTML = '', 3500);
            })
            .withFailureHandler(function() {
                document.getElementById('alertBox').innerHTML = '<div class="alert err"><i class="fas fa-exclamation-circle"></i> Error saving entry.</div>';
                btn.disabled = false;
                btn.innerHTML = '<i class="fas fa-check-circle"></i><span>Save Entry</span>';
            })
            .addDataToSheet(formData);
    }
</script>
</body>
</html>
